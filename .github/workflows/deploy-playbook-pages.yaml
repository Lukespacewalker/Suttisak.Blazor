name: deploy-playbook-pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-playbook-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Playbook
        run: dotnet restore Suttisak.Blazor.Playbook/Suttisak.Blazor.Playbook.csproj -p:Configuration=Release

      - name: Publish Playbook
        run: >
          dotnet publish
          Suttisak.Blazor.Playbook/Suttisak.Blazor.Playbook.csproj
          --configuration Release
          --no-restore
          --output artifacts/playbook
          -p:ContinuousIntegrationBuild=true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy artifacts/playbook/wwwroot
            --project-name=suttisak-blazor-playbook
            --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
