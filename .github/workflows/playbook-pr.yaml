name: playbook-pr

on:
  pull_request:
  workflow_dispatch:

# Pull-request code is untrusted. Keep this workflow read-only and never expose
# publishing credentials here.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: playbook-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  verify-playbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint -color

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Suttisak.Blazor.Playbook.E2ETests/package-lock.json

      - name: Restore solution
        run: dotnet restore Suttisak.Blazor.slnx -p:Configuration=Release

      - name: Build solution
        run: dotnet build Suttisak.Blazor.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test shared components
        run: dotnet test Suttisak.Blazor.UserInterface.Tests/Suttisak.Blazor.UserInterface.Tests.csproj --configuration Release --no-build --no-restore

      - name: Install Playbook test dependencies
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        run: npm ci

      - name: Install Chromium
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        run: npx playwright install --with-deps chromium

      - name: Test Playbook in Chromium
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        env:
          PLAYBOOK_CONFIGURATION: Release
          PLAYBOOK_NO_BUILD: 'true'
        run: npm test
