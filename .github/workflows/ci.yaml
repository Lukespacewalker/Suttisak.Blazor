name: ci

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ci.yaml'
      - 'Suttisak.Blazor.Icons/**'
      - 'Suttisak.Blazor.Identity/**'
      - 'Suttisak.Blazor.Identity.Core/**'
      - 'Suttisak.Blazor.Identity.Generator/**'
      - 'Suttisak.Blazor.UserInterface/**'
      - '*.slnx'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'NuGet.config'
      - '**/NuGet.config'

concurrency:
  group: package-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-publish-lib:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Suttisak.Blazor.Icons/**/*.csproj', 'Suttisak.Blazor.Identity/**/*.csproj', 'Suttisak.Blazor.Identity.Core/**/*.csproj', 'Suttisak.Blazor.Identity.Generator/**/*.csproj', 'Suttisak.Blazor.UserInterface/**/*.csproj', '**/*.props', '**/*.targets', 'global.json', '**/NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore package graph once
        run: dotnet restore Suttisak.Blazor.Identity/Suttisak.Blazor.Identity.csproj -p:Configuration=Release

      - name: Build package graph once
        run: dotnet build Suttisak.Blazor.Identity/Suttisak.Blazor.Identity.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Generate NuGet package
        run: |
          dotnet pack Suttisak.Blazor.Icons/Suttisak.Blazor.Icons.csproj \
          --configuration Release \
          --no-build --no-restore \
          -o packages \
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true
          dotnet pack Suttisak.Blazor.Identity.Generator/Suttisak.Blazor.Identity.Generator.csproj \
          --configuration Release \
          --no-build --no-restore \
          -o packages \
          -p:ContinuousIntegrationBuild=true
          dotnet pack Suttisak.Blazor.UserInterface/Suttisak.Blazor.UserInterface.csproj \
          --configuration Release \
          --no-build --no-restore \
          -o packages \
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true
          dotnet pack Suttisak.Blazor.Identity.Core/Suttisak.Blazor.Identity.Core.csproj \
          --configuration Release \
          --no-build --no-restore \
          -o packages \
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true
          dotnet pack Suttisak.Blazor.Identity/Suttisak.Blazor.Identity.csproj \
          --configuration Release \
          --no-build --no-restore \
          -o packages \
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true

      - name: Publish NuGet packages
        run: |
          push_package() {
            local package_id="$1"
            mapfile -t matches < <(find packages -maxdepth 1 -type f -name "${package_id}.*.nupkg" ! -name '*.snupkg' -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one ordinary NuGet package for ${package_id}, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            dotnet nuget push "${matches[0]}" \
              --api-key "${{ secrets.PUSH_NUGET }}" \
              --source https://nuget.pkg.github.com/LukeSpacewalker/index.json \
              --skip-duplicate
          }

          push_package Suttisak.Blazor.Icons
          push_package Suttisak.Blazor.UserInterface
          push_package Suttisak.Blazor.Identity.Core
          push_package Suttisak.Blazor.Identity.Generator
          push_package Suttisak.Blazor.Identity
