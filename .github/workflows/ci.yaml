name: ci

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/release-packages.yaml'
      - 'Suttisak.Blazor.Icons/**'
      - 'Suttisak.Blazor.Identity/**'
      - 'Suttisak.Blazor.Identity.Core/**'
      - 'Suttisak.Blazor.Identity.Generator/**'
      - 'Suttisak.Blazor.UserInterface/**'
      - 'Suttisak.Blazor.UserInterface.Generator/**'
      - 'Suttisak.Blazor.UserInterface.Tests/**'
      - 'Suttisak.Blazor.Playbook/**'
      - 'Suttisak.Blazor.Playbook.E2ETests/**'
      - '*.slnx'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'NuGet.config'
      - '**/NuGet.config'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Suttisak.Blazor.Playbook.E2ETests/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', '**/NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Suttisak.Blazor.Playbook.E2ETests/package-lock.json') }}

      - name: Restore solution
        run: dotnet restore Suttisak.Blazor.slnx -p:Configuration=Release

      - name: Build solution
        run: dotnet build Suttisak.Blazor.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test shared components
        run: dotnet test Suttisak.Blazor.UserInterface.Tests/Suttisak.Blazor.UserInterface.Tests.csproj --configuration Release --no-build --no-restore

      - name: Install Playbook test dependencies
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        run: npm ci

      - name: Install Chromium
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        run: npx playwright install --with-deps chromium

      - name: Test Playbook in Chromium
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        env:
          PLAYBOOK_CONFIGURATION: Release
          PLAYBOOK_NO_BUILD: 'true'
        run: npm test

      - name: Validate NuGet package production
        run: |
          rm -rf packages
          mkdir -p packages

          dotnet pack Suttisak.Blazor.Icons/Suttisak.Blazor.Icons.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -p:ContinuousIntegrationBuild=true

          dotnet pack Suttisak.Blazor.Identity.Generator/Suttisak.Blazor.Identity.Generator.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:ContinuousIntegrationBuild=true

          dotnet pack Suttisak.Blazor.UserInterface/Suttisak.Blazor.UserInterface.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -p:ContinuousIntegrationBuild=true

          dotnet pack Suttisak.Blazor.Identity.Core/Suttisak.Blazor.Identity.Core.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -p:ContinuousIntegrationBuild=true

          dotnet pack Suttisak.Blazor.Identity/Suttisak.Blazor.Identity.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -p:ContinuousIntegrationBuild=true

          package_count="$(find packages -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' | wc -l)"
          test "${package_count}" -eq 5 || {
            echo "Expected five ordinary NuGet packages, found ${package_count}" >&2
            find packages -maxdepth 1 -type f -print >&2
            exit 1
          }
