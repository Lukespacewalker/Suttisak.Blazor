name: release-packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag or commit to package
        required: true
        type: string
      package_ids:
        description: Space-separated package IDs to publish; use only packages whose versions were bumped
        required: false
        default: Suttisak.Blazor.Icons Suttisak.Blazor.UserInterface Suttisak.Blazor.Identity.Core Suttisak.Blazor.Identity.Generator Suttisak.Blazor.Identity
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-packages-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_PACKAGE_IDS: ${{ inputs.package_ids || 'Suttisak.Blazor.Icons Suttisak.Blazor.UserInterface Suttisak.Blazor.Identity.Core Suttisak.Blazor.Identity.Generator Suttisak.Blazor.Identity' }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Suttisak.Blazor.Playbook.E2ETests/package-lock.json

      - name: Restore solution
        run: dotnet restore Suttisak.Blazor.slnx -p:Configuration=Release

      - name: Build solution
        run: dotnet build Suttisak.Blazor.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test shared components
        run: dotnet test Suttisak.Blazor.UserInterface.Tests/Suttisak.Blazor.UserInterface.Tests.csproj --configuration Release --no-build --no-restore

      - name: Install Playbook test dependencies
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        run: npm ci

      - name: Install Chromium
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        run: npx playwright install --with-deps chromium

      - name: Test Playbook in Chromium
        working-directory: Suttisak.Blazor.Playbook.E2ETests
        env:
          PLAYBOOK_CONFIGURATION: Release
          PLAYBOOK_NO_BUILD: 'true'
        run: npm test

      - name: Pack release artifacts
        run: |
          rm -rf packages
          mkdir -p packages

          dotnet pack Suttisak.Blazor.Icons/Suttisak.Blazor.Icons.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -p:ContinuousIntegrationBuild=true

          dotnet pack Suttisak.Blazor.Identity.Generator/Suttisak.Blazor.Identity.Generator.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:ContinuousIntegrationBuild=true

          dotnet pack Suttisak.Blazor.UserInterface/Suttisak.Blazor.UserInterface.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -p:ContinuousIntegrationBuild=true

          dotnet pack Suttisak.Blazor.Identity.Core/Suttisak.Blazor.Identity.Core.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -p:ContinuousIntegrationBuild=true

          dotnet pack Suttisak.Blazor.Identity/Suttisak.Blazor.Identity.csproj \
            --configuration Release \
            --no-build --no-restore \
            -o packages \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg \
            -p:ContinuousIntegrationBuild=true

      - name: Publish new packages to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_TOKEN: ${{ github.token }}
        run: |
          push_package() {
            local package_id="$1"
            local package_path
            local package_filename
            local package_suffix
            local package_version
            local matches=()

            for package_path in packages/"${package_id}".*.nupkg; do
              [[ -f "${package_path}" && "${package_path}" != *.snupkg ]] || continue
              package_filename="$(basename -- "${package_path}")"
              package_suffix="${package_filename#"${package_id}".}"
              [[ "${package_suffix}" =~ ^[0-9][[:alnum:].-]*\.nupkg$ ]] || continue
              matches+=("${package_path}")
            done

            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one ordinary NuGet package for ${package_id}, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi

            package_filename="$(basename -- "${matches[0]}")"
            package_suffix="${package_filename#"${package_id}".}"
            package_version="${package_suffix%.nupkg}"

            if gh api --paginate \
              "/users/LukeSpacewalker/packages/nuget/${package_id}/versions" \
              --jq '.[].name' 2>/dev/null | grep -Fxq "${package_version}"; then
              echo "${package_id} ${package_version} is already published; skipping."
              return
            fi

            dotnet nuget push "${matches[0]}" \
              --api-key "${NUGET_TOKEN}" \
              --source https://nuget.pkg.github.com/LukeSpacewalker/index.json \
              --skip-duplicate
          }

          for package_id in ${RELEASE_PACKAGE_IDS}; do
            case "${package_id}" in
              Suttisak.Blazor.Icons|Suttisak.Blazor.UserInterface|Suttisak.Blazor.Identity.Core|Suttisak.Blazor.Identity.Generator|Suttisak.Blazor.Identity)
                push_package "${package_id}"
                ;;
              *)
                echo "Unsupported package ID: ${package_id}" >&2
                exit 1
                ;;
            esac
          done

      - name: Attach packages to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_REF}" packages/*.nupkg packages/*.snupkg --clobber
