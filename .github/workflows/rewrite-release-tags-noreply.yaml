name: final-noreply-history-verification

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rewrite-release-tags-noreply.yaml'

permissions:
  contents: write

concurrency:
  group: final-noreply-history-verification
  cancel-in-progress: false

jobs:
  verify-history:
    if: github.repository == 'Lukespacewalker/Suttisak.Blazor'
    runs-on: ubuntu-latest
    steps:
      - name: Scan a fresh mirror and persist evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_BRANCH: chore/verify-noreply-history
        shell: bash
        run: |
          set -euo pipefail
          repository_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --mirror "${repository_url}" repository.git
          cd repository.git

          python - <<'PY'
          import hashlib
          import json
          import subprocess

          old_email_sha256 = "87eef6cfee79ae9bddd80844806138b24c66ec5ad9d674633ccfe6e611cdbcc7"
          noreply_email_sha256 = "e98250a2cdde57501bf918bbfe5e1da647470111b8a15a1ea0829a26daf747f7"

          def run(*args: str) -> list[str]:
              return subprocess.check_output(["git", *args], text=True).splitlines()

          def normalize(value: str) -> str:
              return value.strip().removeprefix("<").removesuffix(">").strip().lower()

          def digest(value: str) -> str:
              return hashlib.sha256(normalize(value).encode("utf-8")).hexdigest()

          def old_matches(values: list[str]) -> int:
              return sum(digest(value) == old_email_sha256 for value in values if normalize(value))

          commit_emails = run("log", "--all", "--format=%ae%n%ce")
          tagger_emails = run("for-each-ref", "--format=%(taggeremail)", "refs/tags")
          emails = [value for value in commit_emails + tagger_emails if normalize(value)]

          refs = run("for-each-ref", "--format=%(refname)", "refs/heads", "refs/tags")
          offenders: list[dict[str, object]] = []
          for ref in refs:
              values = run("log", ref, "--format=%ae%n%ce")
              if ref.startswith("refs/tags/"):
                  values += run("for-each-ref", "--format=%(taggeremail)", ref)
              count = old_matches(values)
              if count:
                  offenders.append({"ref": ref, "matches": count})

          result = {
              "scope": "fresh mirror reachable branches and tags",
              "identity_records_inspected": len(emails),
              "old_identity_hash_matches": old_matches(emails),
              "noreply_identity_hash_matches": sum(
                  digest(value) == noreply_email_sha256 for value in emails
              ),
              "offending_refs": offenders,
          }
          with open("../noreply-history-verification.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          cd ..
          git clone --branch "${MARKER_BRANCH}" --single-branch "${repository_url}" marker
          cp noreply-history-verification.json marker/
          cd marker
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noreply-history-verification.json
          git commit -m 'Record final fresh mirror identity verification'
          git push "${repository_url}" "HEAD:${MARKER_BRANCH}"
