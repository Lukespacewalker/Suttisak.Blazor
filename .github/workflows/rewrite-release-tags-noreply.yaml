name: rewrite-release-tags-noreply

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rewrite-release-tags-noreply.yaml'

permissions:
  contents: write

concurrency:
  group: rewrite-release-tags-noreply
  cancel-in-progress: false

jobs:
  rewrite-tags:
    if: github.repository == 'Lukespacewalker/Suttisak.Blazor' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: pipx install git-filter-repo

      - name: Rewrite and verify release tags
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_BRANCH: chore/rewrite-release-tags-noreply
        run: |
          set -euo pipefail

          repository_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          old_email_sha256="87eef6cfee79ae9bddd80844806138b24c66ec5ad9d674633ccfe6e611cdbcc7"

          count_old_identity_hashes() {
            python - "${old_email_sha256}" <<'PY'
          import hashlib
          import subprocess
          import sys

          expected = sys.argv[1]
          values = subprocess.check_output(
              ["git", "log", "--all", "--format=%ae%n%ce"],
              text=True,
          ).splitlines()
          values += subprocess.check_output(
              ["git", "for-each-ref", "--format=%(taggeremail)", "refs/tags"],
              text=True,
          ).splitlines()

          def normalize(value: str) -> str:
              return value.strip().removeprefix("<").removesuffix(">").strip().lower()

          print(sum(
              hashlib.sha256(normalize(value).encode("utf-8")).hexdigest() == expected
              for value in values
              if normalize(value)
          ))
          PY
          }

          git clone --mirror "${repository_url}" repository.git
          cd repository.git

          before_count="$(count_old_identity_hashes)"
          echo "Old identity hash matches before tag rewrite: ${before_count}"

          git filter-repo --force --email-callback '
          return b"17828352+Lukespacewalker@users.noreply.github.com" if __import__("hashlib").sha256(email.lower()).hexdigest() == "87eef6cfee79ae9bddd80844806138b24c66ec5ad9d674633ccfe6e611cdbcc7" else email
          '

          local_remaining="$(count_old_identity_hashes)"
          if [[ "${local_remaining}" != "0" ]]; then
            echo "Local rewrite verification failed: ${local_remaining} old identity hash match(es) remain." >&2
            exit 1
          fi

          mapfile -t tag_refs < <(git for-each-ref --format='%(refname)' refs/tags)
          echo "Force-updating ${#tag_refs[@]} tag ref(s)."
          for tag_ref in "${tag_refs[@]}"; do
            git push --force "${repository_url}" "+${tag_ref}:${tag_ref}"
          done

          cd ..
          git clone --mirror "${repository_url}" verification.git
          cd verification.git
          remote_remaining="$(count_old_identity_hashes)"
          if [[ "${remote_remaining}" != "0" ]]; then
            echo "Remote verification failed: ${remote_remaining} old identity hash match(es) remain." >&2
            exit 1
          fi
          cd ..

          git clone --branch "${MARKER_BRANCH}" --single-branch "${repository_url}" marker
          cd marker
          cat > rewrite-tags-result.txt <<EOF
          Release tag identity rewrite completed.
          Old identity hash matches before rewrite: ${before_count}
          Old identity hash matches after fresh remote clone: ${remote_remaining}
          Tags force-updated: ${#tag_refs[@]}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rewrite-tags-result.txt
          git commit -m 'Record successful release tag history rewrite'
          git push "${repository_url}" "HEAD:${MARKER_BRANCH}"
